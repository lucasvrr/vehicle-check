<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vehicle Check">
<title>Vehicle Check</title>
<style>
  :root{
    --navy:#152A5E;
    --navy-deep:#0C1938;
    --gold:#F5B71A;
    --paper:#EFF1F6;
    --line:rgba(239,241,246,.22);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--navy-deep);
    color:var(--paper);
    font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
  }
  #screen{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:max(24px,env(safe-area-inset-top)) 24px 96px;
    background:var(--navy);
    transition:background .1s linear;
    cursor:pointer;
  }
  .eyebrow{
    font-size:clamp(11px,1.6vh,15px);
    font-weight:700;letter-spacing:.32em;text-transform:uppercase;
    color:var(--gold);text-align:center;
  }
  .prompt{
    margin-top:4vh;
    font-size:clamp(30px,7.4vh,84px);
    font-weight:800;line-height:.98;letter-spacing:-.02em;
    text-transform:uppercase;text-align:center;
  }
  .hint{
    margin-top:3vh;
    font-size:clamp(12px,1.8vh,17px);
    letter-spacing:.18em;text-transform:uppercase;
    color:rgba(239,241,246,.55);
  }
  #screen.selected{background:var(--gold);color:var(--navy-deep)}
  #screen.standard{background:var(--navy-deep)}
  .verdict{
    font-size:clamp(40px,13vh,180px);
    font-weight:900;line-height:.88;letter-spacing:-.035em;
    text-transform:uppercase;text-align:center;
  }
  #screen.standard .verdict{color:var(--paper)}
  .rule{width:clamp(60px,14vw,160px);height:6px;margin:4.5vh 0;background:currentColor;opacity:.9}
  .sub{
    font-size:clamp(13px,2.1vh,22px);
    font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    opacity:.7;text-align:center;
  }
  #tally{
    position:fixed;left:0;right:0;bottom:0;
    padding:14px 20px max(14px,env(safe-area-inset-bottom));
    display:flex;gap:26px;align-items:baseline;justify-content:center;
    border-top:1px solid var(--line);
    font-size:clamp(11px,1.5vh,14px);letter-spacing:.14em;text-transform:uppercase;
    color:rgba(239,241,246,.6);cursor:pointer;
  }
  #tally b{font-size:clamp(15px,2.2vh,21px);font-weight:800;color:var(--paper);letter-spacing:0}
  #screen.result ~ #tally{opacity:0;pointer-events:none}

  #log{
    position:fixed;inset:0;z-index:10;display:none;flex-direction:column;
    background:var(--navy-deep);
    padding:max(20px,env(safe-area-inset-top)) 22px max(20px,env(safe-area-inset-bottom));
  }
  #log.open{display:flex}
  .log-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .log-title{font-size:16px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
  .head-actions{display:flex;gap:8px}

  .summary{
    display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
    padding:20px 2px;border-bottom:1px solid var(--line);
  }
  .stat{display:flex;flex-direction:column;align-items:center;gap:5px}
  .stat b{font-size:clamp(20px,3.6vh,30px);font-weight:800;color:var(--paper);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .stat b.g{color:var(--gold)}
  .stat span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(239,241,246,.45);font-weight:700}

  .log-rows{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:4px}
  .row{padding:15px 2px;border-bottom:1px solid rgba(239,241,246,.09)}
  .r-top{display:flex;align-items:baseline;justify-content:space-between}
  .row .d{font-size:15px;font-weight:700}
  .row .p{font-size:16px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
  .bar{margin:9px 0 7px;height:6px;border-radius:99px;background:rgba(239,241,246,.1);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s ease}
  .r-sub{font-size:12px;color:rgba(239,241,246,.5);font-variant-numeric:tabular-nums}
  .empty{padding:48px 0;text-align:center;color:rgba(239,241,246,.45);font-size:14px}

  .log-foot{display:flex;gap:10px;padding-top:16px}
  button{
    padding:13px 18px;border:1px solid var(--line);border-radius:10px;
    background:none;color:rgba(239,241,246,.75);font:inherit;font-size:12px;
    font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
  }
  button.primary{background:var(--gold);border-color:var(--gold);color:var(--navy-deep)}
  button.icon{padding:13px 14px}
  .log-foot button{flex:1}

  #pin{
    position:fixed;inset:0;z-index:20;display:none;
    align-items:center;justify-content:center;padding:24px;
    background:rgba(12,25,56,.82);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  }
  #pin.open{display:flex}
  .sheet{
    width:100%;max-width:320px;background:var(--navy);
    border:1px solid var(--line);border-radius:16px;
    padding:22px;display:flex;flex-direction:column;gap:14px;
  }
  .sheet-title{font-size:15px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);text-align:center}
  #pin-input{
    width:100%;text-align:center;font-size:30px;letter-spacing:.4em;font-weight:800;
    padding:14px 14px 14px 24px;border:1px solid var(--line);border-radius:12px;
    background:var(--navy-deep);color:var(--paper);font-family:inherit;
  }
  #pin-input:focus{outline:none;border-color:var(--gold)}
  .pin-msg{min-height:16px;text-align:center;font-size:12px;color:rgba(239,241,246,.6);letter-spacing:.02em}
  .sheet-foot{display:flex;gap:10px}
  .sheet-foot button{flex:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="screen">
  <div id="idle">
    <div class="eyebrow">Vehicle Screening</div>
    <div class="prompt">Tap to<br>check vehicle</div>
    <div class="hint">Anywhere on screen</div>
  </div>
</div>

<div id="tally">
  <span>Selected <b id="c-sel">0</b></span>
  <span>Total <b id="c-tot">0</b></span>
  <span>Rate <b id="c-pct">&mdash;</b></span>
</div>

<div id="log">
  <div class="log-head">
    <div class="log-title">Daily record</div>
    <div class="head-actions">
      <button id="close">Close</button>
    </div>
  </div>
  <div class="summary">
    <div class="stat"><b id="s-days">0</b><span>Days</span></div>
    <div class="stat"><b id="s-sel" class="g">0</b><span>Selected</span></div>
    <div class="stat"><b id="s-tot">0</b><span>Total</span></div>
    <div class="stat"><b id="s-rate" class="g">&mdash;</b><span>Rate</span></div>
  </div>
  <div class="log-rows">
    <div id="rows"></div>
  </div>
  <div class="log-foot">
    <button class="primary" id="download">Download for Excel</button>
    <button id="clear">Clear all</button>
  </div>
</div>

<div id="pin">
  <div class="sheet">
    <div class="sheet-title" id="pin-title">Enter PIN</div>
    <input id="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="&bull;&bull;&bull;&bull;">
    <div class="pin-msg" id="pin-msg"></div>
    <div class="sheet-foot">
      <button id="pin-cancel">Cancel</button>
      <button class="primary" id="pin-ok">OK</button>
    </div>
  </div>
</div>

<script>
(function(){
  var RATE = 0.35;
  var KEY  = 'vehicle-check-log';
  // Fixed PIN, stored only as a hash so the number never appears in the source.
  // To change it: compute cyrb53('<new pin>') and replace the value below.
  var PIN_HASH = 4183276382906143;
  function pinHash(s){
    var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for(var i=0, ch; i<s.length; i++){
      ch = s.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1>>>16), 2246822507); h1 ^= Math.imul(h2 ^ (h2>>>13), 3266489909);
    h2 = Math.imul(h2 ^ (h2>>>16), 2246822507); h2 ^= Math.imul(h1 ^ (h1>>>13), 3266489909);
    return 4294967296 * (2097151 & h2) + (h1>>>0);
  }
  var screenEl = document.getElementById('screen');
  var logEl    = document.getElementById('log');
  var idleHTML = document.getElementById('idle').outerHTML;
  var showingResult = false;
  var log = {};
  var shownDate = '';

  var WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function today(){
    var d = new Date(), p = function(n){ return (n<10?'0':'') + n; };
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
  }
  function day(){
    if(!log[today()]) log[today()] = {sel:0, tot:0};
    return log[today()];
  }

  function load(){
    try{ log = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ log = {}; }
    paint();
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(log)); }catch(e){}
  }

  function pct(d){ return d.tot ? Math.round(d.sel / d.tot * 100) + '%' : '—'; }
  function pctNum(d){ return d.tot ? Math.round(d.sel / d.tot * 100) : 0; }

  function paint(){
    shownDate = today();
    var d = day();
    document.getElementById('c-sel').textContent = d.sel;
    document.getElementById('c-tot').textContent = d.tot;
    document.getElementById('c-pct').textContent = pct(d);
  }

  function draw(){
    var d = day();
    var hit = Math.random() < RATE;
    d.tot++; if(hit) d.sel++;
    save(); paint();

    screenEl.className = 'result ' + (hit ? 'selected' : 'standard');
    screenEl.innerHTML =
      '<div class="verdict">' +
        (hit ? 'Additional<br>screening<br>required' : 'Standard<br>security<br>checks only') +
      '</div>' +
      '<div class="rule"></div>' +
      '<div class="sub">Tap to continue</div>';
    showingResult = true;
  }

  function reset(){
    screenEl.className = '';
    screenEl.innerHTML = idleHTML;
    showingResult = false;
  }

  screenEl.addEventListener('click', function(){ showingResult ? reset() : draw(); });

  // Keep the tally honest across a midnight rollover or when the app is
  // brought back to the foreground (it was frozen on the old day's numbers).
  function refresh(){
    paint();
    if(logEl.classList.contains('open')) renderLog();
  }
  setInterval(function(){ if(today() !== shownDate) refresh(); }, 15000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) refresh(); });
  window.addEventListener('focus', refresh);
  window.addEventListener('pageshow', refresh);

  function dates(){ return Object.keys(log).sort().reverse(); }

  function fmtDate(k){
    var a = k.split('-');
    var dt = new Date(+a[0], +a[1]-1, +a[2]);
    return WD[dt.getDay()] + ', ' + (+a[2]) + ' ' + MO[+a[1]-1];
  }

  function renderLog(){
    var ds = dates(), tSel = 0, tTot = 0;
    ds.forEach(function(k){ tSel += log[k].sel; tTot += log[k].tot; });

    document.getElementById('s-days').textContent = ds.length;
    document.getElementById('s-sel').textContent  = tSel;
    document.getElementById('s-tot').textContent  = tTot;
    document.getElementById('s-rate').textContent = tTot ? Math.round(tSel / tTot * 100) + '%' : '—';

    var out = '';
    if(!ds.length){
      out = '<div class="empty">No checks recorded yet.</div>';
    } else {
      ds.forEach(function(k){
        var d = log[k];
        out += '<div class="row">' +
                 '<div class="r-top"><span class="d">' + fmtDate(k) + '</span>' +
                 '<span class="p">' + pct(d) + '</span></div>' +
                 '<div class="bar"><i style="width:' + pctNum(d) + '%"></i></div>' +
                 '<div class="r-sub">' + d.sel + ' selected · ' + d.tot + ' total</div>' +
               '</div>';
      });
    }
    document.getElementById('rows').innerHTML = out;
    logEl.classList.add('open');
  }

  document.getElementById('tally').addEventListener('click', renderLog);
  document.getElementById('close').addEventListener('click', function(){
    logEl.classList.remove('open');
  });

  /* ---- PIN protection (fixed PIN, verify only) ---- */
  var pinEl    = document.getElementById('pin');
  var pinInput = document.getElementById('pin-input');
  var pinMsg   = document.getElementById('pin-msg');
  var pinCb    = null;

  function openPin(cb){
    pinCb = cb;
    pinMsg.textContent = '';
    pinInput.value = '';
    pinEl.classList.add('open');
    setTimeout(function(){ pinInput.focus(); }, 50);
  }
  function closePin(){ pinEl.classList.remove('open'); pinCb = null; }

  function submitPin(){
    var v = pinInput.value.trim();
    if(!/^\d{4}$/.test(v)){ pinMsg.textContent = 'Enter 4 digits.'; return; }
    if(pinHash(v) === PIN_HASH){
      var cb = pinCb; closePin(); if(cb) cb();
    } else {
      pinMsg.textContent = 'Wrong PIN.'; pinInput.value = '';
    }
  }
  document.getElementById('pin-ok').addEventListener('click', submitPin);
  document.getElementById('pin-cancel').addEventListener('click', closePin);
  pinInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') submitPin(); });

  /* ---- Download (opens straight in Excel) ---- */
  document.getElementById('download').addEventListener('click', function(){
    var SEP = ';'; // pt-BR Excel splits on ';'
    var csv = '﻿' + ['Data','Selecionados','Nao selecionados','Total','Taxa'].join(SEP) + '\r\n';
    dates().slice().reverse().forEach(function(k){
      var d = log[k], a = k.split('-');
      var br = a[2] + '/' + a[1] + '/' + a[0];
      var rate = d.tot ? (d.sel / d.tot * 100).toFixed(1).replace('.', ',') + '%' : '0%';
      csv += [br, d.sel, (d.tot - d.sel), d.tot, rate].join(SEP) + '\r\n';
    });
    var blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url; a.download = 'vehicle-check-' + today() + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);

    var b = document.getElementById('download');
    b.textContent = 'Downloaded';
    setTimeout(function(){ b.textContent = 'Download for Excel'; }, 1600);
  });

  /* ---- Clear (PIN-gated) ---- */
  document.getElementById('clear').addEventListener('click', function(){
    openPin(function(){
      if(confirm('Delete the entire record?')){ log = {}; save(); paint(); renderLog(); }
    });
  });

  load();
})();
</script>
</body>
</html>
